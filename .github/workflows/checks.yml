name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - run: node --test scripts/opencode-defaults.test.cjs
      - run: node --test scripts/native-review/tests/zcode.test.cjs
      - run: npm run check:release
